<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAM · Groove &amp; Mood</title>
<meta name="description" content="경북대 밴드동아리 GAM 부원 게시판">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F2EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -22 40 40'%3E%3Cellipse cx='0' cy='2' rx='17' ry='15' fill='%23E2682B'/%3E%3Cpath d='M0-13 7-16 4-10 10-8 3-7 0-3-3-7-10-8-4-10-7-16Z' fill='%232A241E'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("gam.theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ==========================================================
   밝게 (기본) — iOS 스타일 + 감색 포인트
   ========================================================== */
:root{
  color-scheme: light;
  --bg:#F5F2EC;
  --card:#FFFFFF;
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.07);
  --sep:rgba(60,60,67,.13);
  --label:#1C1B19;
  --label-2:rgba(60,60,67,.64);
  --label-3:rgba(60,60,67,.38);
  --accent:#E0622A;          /* 감 */
  --accent-press:#C9541F;
  --accent-soft:rgba(224,98,42,.12);
  --on-accent:#FFFFFF;
  --red:#E5483B;
  --glass:rgba(255,255,255,.64);
  --glass-strong:rgba(255,255,255,.82);
  --glass-edge:rgba(0,0,0,.09);
  --glass-hi:rgba(255,255,255,.95);
  --glass-shadow:0 10px 30px rgba(40,30,20,.12), 0 1px 3px rgba(40,30,20,.06);
  --scrim:rgba(20,15,10,.28);
  /* 첫 화면 그림 */
  --ink:#231F1B; --ink-soft:#4C443C; --fruit:#E2682B; --fruit-hi:#F6A56A; --calyx:#2A241E;
  --moon:#F4C94E; --moon-hi:#FBE08E; --cloud:#E3D6BF; --seal:#C0392B;
}
/* ==========================================================
   어둡게
   ========================================================== */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000;
  --card:#1C1C1E;
  --fill:rgba(118,118,128,.24);
  --fill-2:rgba(118,118,128,.14);
  --sep:rgba(84,84,88,.55);
  --label:#F5F5F7;
  --label-2:rgba(235,235,245,.62);
  --label-3:rgba(235,235,245,.32);
  --accent:#FF7A3D;
  --accent-press:#FF915E;
  --accent-soft:rgba(255,122,61,.18);
  --on-accent:#1A0D05;
  --red:#FF6B5E;
  --glass:rgba(38,38,40,.58);
  --glass-strong:rgba(44,44,46,.82);
  --glass-edge:rgba(255,255,255,.10);
  --glass-hi:rgba(255,255,255,.16);
  --glass-shadow:0 10px 30px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.5);
  --ink:#B9AF9D; --ink-soft:#877D6E; --fruit:#EE7436; --fruit-hi:#FFB27A; --calyx:#3A332B;
  --moon:#E9BE45; --moon-hi:#F7DA82; --cloud:#2A2620; --seal:#C8443A;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
html.lock{overflow:hidden}
a{color:var(--accent);text-decoration:none}
button,input,textarea{font:inherit;letter-spacing:inherit}
button{cursor:pointer;color:inherit;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none !important}
.wrap{max-width:720px;margin:0 auto;padding-left:20px;padding-right:20px}
svg.i{width:1em;height:1em;display:block;flex:none}

/* 리퀴드 글래스 */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge), var(--glass-shadow);
}

/* 입력칸 */
input,textarea{width:100%;background:var(--fill);border:none;border-radius:12px;padding:11px 14px;color:var(--label);font-size:17px}
input::placeholder,textarea::placeholder{color:var(--label-3)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
textarea{resize:vertical;min-height:120px;line-height:1.5}

/* 버튼 (캡슐) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 18px;
  font-size:16px;font-weight:600;white-space:nowrap;background:var(--fill);color:var(--accent);transition:transform .12s, background .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn--fill{background:var(--accent);color:var(--on-accent)}
.btn--fill:active{background:var(--accent-press)}
.btn--sm{padding:6px 14px;font-size:14px}
.btn--wide{width:100%;padding:14px 18px;font-size:17px}
.btn--mine{background:var(--fill);color:var(--label-2)}
.textbtn{font-size:17px;color:var(--accent);padding:6px 4px}
.textbtn--bold{font-weight:600}
.textbtn:disabled{opacity:.4}
.textbtn--red{color:var(--red)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;color:var(--label);font-size:19px;
  transition:transform .12s}
.gbtn:active{transform:scale(.93)}
.gbtn--accent{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(224,98,42,.35)}

/* 로고 */
.seal{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;background:var(--seal);color:#FFF6EC;
  border-radius:7px;font-weight:700;font-size:15px;line-height:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.12em}

/* ---------- 첫 화면 ---------- */
#gate{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px 60px;overflow:hidden}
.hero{width:100%;max-width:420px;height:auto;display:block;margin-bottom:-30px;position:relative;z-index:1}
.cloud{position:absolute;pointer-events:none;color:var(--cloud)}
.cloud svg{display:block;width:100%;height:auto}
.plate{position:relative;z-index:2;width:100%;max-width:380px;border-radius:30px;padding:28px 24px 22px}
.plate h1{margin:0;display:flex;align-items:center;gap:10px;font-size:30px;font-weight:700;letter-spacing:.12em}
.plate h1 .seal{width:34px;height:34px;font-size:19px;border-radius:9px;letter-spacing:0}
.plate__sub{margin:6px 0 18px;color:var(--label-2);font-size:14px;letter-spacing:0}
.plate__lead{margin:0 0 14px;font-size:15px;color:var(--label)}
.gate__err{font-size:14px;color:var(--red);min-height:22px;margin:6px 2px}
.gate__foot{margin:14px 0 0;font-size:13px;color:var(--label-2);text-align:center}
.gate__theme{position:absolute;top:max(16px, env(safe-area-inset-top));right:16px;z-index:3}
.saekdong{height:8px;background:linear-gradient(90deg,
  #2B2A28 0 12.5%, #3E9C9A 12.5% 25%, #F3EEE3 25% 37.5%, #D5423A 37.5% 50%,
  #EDBB2F 50% 62.5%, #2F5AA3 62.5% 75%, #3F8A5C 75% 87.5%, #E3702E 87.5% 100%)}
.saekdong--gate{position:absolute;left:0;right:0;bottom:0}
:root[data-theme="dark"] .saekdong{opacity:.75}

/* ---------- 상단 바 ---------- */
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);transition:background .2s, box-shadow .2s}
.nav:not(.scrolled){background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.nav__in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
.nav__right{display:flex;align-items:center;gap:8px}
.adminPill{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;letter-spacing:0}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
  font-size:15px;font-weight:600;color:#fff;background:var(--av, #8E8E93)}
#meBtn{padding:3px}

/* ---------- 본문 ---------- */
main.wrap{padding-top:6px;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.lt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 2px}
.lt h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.lt__act{display:flex;gap:10px}
.lt__desc{margin:4px 0 22px;color:var(--label-2);font-size:15px;line-height:1.45}
.notice-bar{background:var(--accent-soft);color:var(--label);border-radius:14px;padding:12px 16px;margin:0 0 18px;font-size:14px}
.notice-bar code{background:var(--fill);padding:1px 6px;border-radius:6px;font-size:13px}

/* 인셋 그룹 리스트 */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 16px 7px;font-size:13px;color:var(--label-2);letter-spacing:0}
.sec-h b{font-weight:600;text-transform:none}
.group{background:var(--card);border-radius:22px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;color:inherit;min-height:48px}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
a.row, button.row{width:100%;text-align:left;transition:background .12s}
a.row:active, button.row:active{background:var(--fill-2)}
.row__main{flex:1;min-width:0}
.row__t{font-size:17px;font-weight:600;line-height:1.35;word-break:break-word}
.row__t .artist{font-weight:400;color:var(--label-2);font-size:15px}
.row__pre{margin-top:2px;color:var(--label-2);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.row__meta{margin-top:4px;font-size:13px;color:var(--label-3);letter-spacing:0}
.row__meta b{font-weight:500;color:var(--label-2)}
.chev{color:var(--label-3);font-size:14px}
.pin{display:inline-flex;vertical-align:-2px;color:var(--accent);margin-right:5px;font-size:15px}
.tag{font-size:12px;color:var(--label-3);margin-left:3px;font-weight:400;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--fill-2);color:var(--label-3);letter-spacing:0}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip b{margin-left:3px}
.empty{background:var(--card);border-radius:22px;padding:40px 22px;text-align:center;color:var(--label-2);font-size:15px}
.empty b{display:block;color:var(--label);font-size:17px;margin:6px 0 4px}

/* 상세 */
.back{display:inline-flex;align-items:center;gap:2px;font-size:17px;color:var(--accent);margin:2px 0 10px -4px;padding:4px}
.back svg{font-size:22px}
.post{padding:20px 18px}
.post h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;word-break:break-word}
.post__artist{margin:3px 0 0;color:var(--label-2);font-size:17px}
.post__meta{margin-top:10px;font-size:13px;color:var(--label-3);letter-spacing:0}
.post__meta b{font-weight:500;color:var(--label-2)}
.post__body{margin-top:16px;white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.55}
.actrow{color:var(--accent);font-size:17px;justify-content:space-between}
.actrow.red{color:var(--red)}

/* 세션 */
.slot{align-items:flex-start}
.slot__name{font-size:17px;font-weight:600}
.slot__cnt{font-size:13px;color:var(--label-3);margin-left:6px;font-weight:400}
.slot__who{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.who{display:inline-flex;align-items:center;gap:2px;font-size:14px;background:var(--fill-2);padding:3px 10px;border-radius:999px;letter-spacing:0}
.who.me{background:var(--accent-soft);color:var(--accent);font-weight:600}
.who .x{margin-left:4px;color:var(--label-3);font-size:14px;line-height:1}
.slot__none{margin-top:4px;font-size:14px;color:var(--label-3)}
.slot .btn{align-self:center;flex:none}

/* 댓글 */
.cmt{align-items:flex-start}
.cav{width:32px;height:32px;flex:none;margin-top:2px}
.cmt__h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:14px}
.cmt__h em{font-style:normal;font-weight:600}
.cmt__h time{font-size:12.5px;color:var(--label-3)}
.cmt__adm{margin-left:auto;display:flex;gap:12px;font-size:13px}
.cmt__adm button{color:var(--accent)}
.cmt__adm button.red{color:var(--red)}
.cmt p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word;font-size:16px}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px 10px 16px}
.composer input{border-radius:999px;padding:9px 16px;font-size:16px}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.send:disabled{background:var(--fill);color:var(--label-3)}

/* ---------- 하단 탭 바 ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:2px;padding:5px;border-radius:999px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:76px;padding:7px 10px 6px;border-radius:999px;
  color:var(--label);font-size:11px;font-weight:600;letter-spacing:0;transition:background .2s,color .2s}
.tab svg{font-size:23px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* ---------- 바텀 시트 ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);
  border-radius:28px 28px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@media (min-width:700px){ .sheet-wrap{align-items:center} .sheet{border-radius:28px;padding-bottom:24px} }
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto 6px}
.sheet__head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.sheet__head b{font-size:17px}
.sheet .group{margin-bottom:12px}
.frow{display:block;padding:10px 16px}
.frow + .frow{border-top:.5px solid var(--sep)}
.frow span{display:block;font-size:13px;color:var(--label-2);margin-bottom:5px;letter-spacing:0}
.frow input,.frow textarea{background:transparent;padding:0;border-radius:0;box-shadow:none !important}
.sheet .note{font-size:13px;color:var(--label-2);margin:-4px 16px 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 세그먼트 컨트롤 */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{padding:6px 16px;border-radius:8px;font-size:14px;font-weight:500;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
.srow{justify-content:space-between}
.srow .val{color:var(--label-2);display:flex;align-items:center;gap:6px}
.srow input{background:transparent;padding:0;text-align:right;max-width:60%;box-shadow:none !important;color:var(--label-2)}

/* 세션 구성 고르기 */
.pickbox{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px}
.pickbox .lab{display:block;font-size:13px;color:var(--label-2);margin-bottom:10px;letter-spacing:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pk{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:6px 12px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:0}
.pk.off{background:var(--fill-2);color:var(--label-3);font-weight:400;text-decoration:line-through}
.pk .rm{font-weight:400;opacity:.7}
.pick-add{display:flex;gap:8px;margin-top:10px}
.pick-add input{padding:8px 14px;font-size:15px;border-radius:999px}

/* 토스트 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:50;
  padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;animation:fade .2s ease}
.toast.top{bottom:auto;top:20px}

@media (max-width:420px){
  .wrap{padding-left:16px;padding-right:16px}
  .nav__in{padding:10px 16px}
  .lt h1{font-size:30px}
  .tab{min-width:0;flex:1;padding:7px 6px 6px}
  .tabbar{left:12px;right:12px;transform:none;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (prefers-reduced-transparency:reduce){ .glass{background:var(--glass-strong)} }
</style>
</head>
<body>

<!-- 감 그림 (한 번 정의해서 여러 곳에 씀) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gamFruit" viewBox="-20 -22 40 40">
    <path d="M0 -13 L0 -20" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="0" cy="2" rx="17" ry="15" fill="var(--fruit)"/>
    <ellipse cx="-6.5" cy="-3" rx="5" ry="3.2" fill="var(--fruit-hi)" opacity=".55"/>
    <path d="M0 -13 L7 -16.5 L4.5 -10 L11 -8.5 L3.5 -7 L0 -2.5 L-3.5 -7 L-11 -8.5 L-4.5 -10 L-7 -16.5 Z" fill="var(--calyx)"/>
  </symbol>
  <!-- 구름무늬 (선으로만) -->
  <symbol id="gamCloud" viewBox="0 0 120 56">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M8 44 H104 C114 44 116 32 106 30 C108 18 94 14 88 22 C86 8 66 6 62 18 C56 10 42 12 42 24 C32 20 24 28 28 36 C18 34 10 38 8 44 Z"/>
      <path d="M50 30 C50 24 58 22 60 28 C61 32 56 34 54 31"/>
      <path d="M76 26 C77 20 85 20 86 26 C86 30 81 31 80 28"/>
      <path d="M30 44 C36 40 44 40 48 44"/>
    </g>
  </symbol>
</svg>

<div id="gate">
  <button class="gbtn glass gate__theme themeBtn" type="button" aria-label="화면 밝기 바꾸기"></button>
  <div class="cloud" style="top:26px;left:-10px;width:130px" aria-hidden="true"><svg viewBox="0 0 120 56"><use href="#gamCloud"/></svg></div>
  <div class="cloud" style="bottom:38px;right:-6px;width:150px" aria-hidden="true"><svg viewBox="0 0 120 56"><use href="#gamCloud"/></svg></div>
  <!-- 보름달 + 수묵 감나무 가지 -->
  <svg class="hero" viewBox="0 0 440 280" aria-hidden="true">
    <defs>
      <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
        <feGaussianBlur stdDeviation="2.2"/>
      </filter>
      <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
      </filter>
      <radialGradient id="moonGrad" cx="45%" cy="40%" r="60%">
        <stop offset="0" stop-color="var(--moon-hi)"/>
        <stop offset=".75" stop-color="var(--moon)"/>
        <stop offset="1" stop-color="var(--moon)" stop-opacity=".75"/>
      </radialGradient>
      <path id="leaf" d="M0 0 C7 -7 20 -7 28 0 C20 6 7 6 0 0 Z"/>
    </defs>

/* ---------- 화면 밝기 (밝게 ↔ 어둡게) ---------- */
const theme = () => document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
function paintTheme(){
  document.querySelectorAll(".themeBtn").forEach(b => { b.innerHTML = theme() === "dark" ? ICON.sun : ICON.moon; });
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === theme())));

  if(m) m.content = theme() === "dark" ? "#000000" : "#F5F2EC";
}
function setTheme(next){
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("gam.theme", next); }catch(e){}
  paintTheme();
}
document.querySelectorAll(".themeBtn").forEach(b => b.addEventListener("click", () => setTheme(theme() === "dark" ? "light" : "dark")));

/* ---------- 이름(닉네임) 저장 ---------- */
let memNick = "";
const nick = () => { try{ return localStorage.getItem("gam.nick") || memNick; }catch(e){ return memNick; } };
function saveNick(v){
  v = String(v || "").trim().slice(0, 20);
  if(!v) return false;
  memNick = v;
  try{ localStorage.setItem("gam.nick", v); }catch(e){}
  return true;
}
function askNick(force){
  if(nick() && !force){ paintNick(); return; }
  const v = prompt("게시판에 표시될 이름을 적어 주세요. (예: 김상오 18기)", nick());
  if(v !== null) saveNick(v);
  paintNick(); render();
}
// 이름 첫 글자로 만든 동그라미 (사람마다 색이 달라요)

function avColor(id){ let h = 0; String(id || "").split("").forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return AV_COLORS[h % AV_COLORS.length]; }
const initial = n => (String(n || "?").trim()[0] || "?");
function avatarHTML(name, id, cls){
  return '<span class="avatar ' + (cls || "") + '" style="--av:' + avColor(id || name) + '">' + esc(initial(name)) + '</span>';
}

  const el = $("meAvatar");

/* ---------- 주소(#/게시판/글ID)로 화면 전환 ---------- */
function route(){
  const m = location.hash.match(/^#\/(notice|setlist|free|suggest)(?:\/([\w-]+))?$/);

/* ---------- 세션 구성 고르기 (글쓰기·관리자 수정 공용) ---------- */
// pick = { off: 뺀 기본 세션 key 목록, custom: [{k,label}] }
const picks = { new: null, edit: null };
const freshPick = () => ({ off: [], custom: [] });
function pickFromSlots(slots){
  const keys = slots.map(s => s.k);
  return {
    off: DEFAULT_SLOTS.filter(s => !keys.includes(s.k)).map(s => s.k),
    custom: slots.filter(s => CUSTOM_KEYS.includes(s.k)).map(s => ({ k: s.k, label: s.label }))
  };
}
function slotsFromPick(pk){
  return [ ...DEFAULT_SLOTS.filter(s => !pk.off.includes(s.k)), ...pk.custom ];
}
function pickHTML(scope){
  const pk = picks[scope];
  let h = '<span class="lab">세션 구성 — 필요 없는 세션은 눌러서 빼고, 필요한 세션은 추가해 주세요. 같은 세션도 여러 개 넣을 수 있어요.</span><div class="pick">';
  h += DEFAULT_SLOTS.map(s => {
    const off = pk.off.includes(s.k);
    return '<button type="button" class="pk' + (off ? " off" : "") + '" data-pk="toggle" data-k="' + s.k + '" aria-pressed="' + !off + '">' + esc(s.label) + '</button>';
  }).join("");
  h += pk.custom.map(s => '<button type="button" class="pk custom" data-pk="remove" data-k="' + esc(s.k) + '" title="빼기">' +
    esc(s.label) + '<span class="rm">×</span></button>').join("");
  h += '</div>';
  if(pk.custom.length < CUSTOM_KEYS.length){
    h += '<div class="pick-add"><input data-pkin="1" maxlength="12" placeholder="세션 추가 (예: 보컬, 코러스)">' +
         '<button type="button" class="btn btn--sm" data-pk="add">추가</button></div>';
  }
  return h;
}
function paintPick(scope){
  const box = scope === "new" ? $("wrapPick") : $("detailView").querySelector('[data-scope="edit"]');
  if(box) box.innerHTML = pickHTML(scope);
}
function pickAction(scope, act, key, box){
  const pk = picks[scope];
  if(!pk) return;
  if(act === "toggle"){
    if(pk.off.includes(key)) pk.off = pk.off.filter(k => k !== key);
    else {
      if(slotsFromPick(pk).length <= 1) return toast("세션은 하나 이상 있어야 해요.");
      pk.off = [...pk.off, key];
    }
  } else if(act === "remove"){
    if(slotsFromPick(pk).length <= 1) return toast("세션은 하나 이상 있어야 해요.");
    pk.custom = pk.custom.filter(s => s.k !== key);
  } else if(act === "add"){
    const inp = box.querySelector("[data-pkin]");
    const label = String(inp && inp.value || "").trim().slice(0, 12);
    if(!label) return inp && inp.focus();
    const all = [...DEFAULT_SLOTS, ...pk.custom];
    const norm = t => t.replace(/\s/g,"").replace(/\d+$/,"");
    const base = label.replace(/\s*\d+$/,"");
    const offDefault = DEFAULT_SLOTS.find(s => pk.off.includes(s.k) && norm(s.label) === norm(label));
    if(offDefault){
      // 빼 두었던 기본 세션이면 다시 켜기
      pk.off = pk.off.filter(k => k !== offDefault.k);
    } else {
      const k = CUSTOM_KEYS.find(k => !pk.custom.some(s => s.k === k));
      if(!k) return toast("세션은 최대 6개까지 추가할 수 있어요.");
      // 같은 세션이 이미 있으면 "보컬 2", "보컬 3"처럼 번호를 붙여 구분
      const active = slotsFromPick(pk);
      const n = active.filter(s => norm(s.label) === norm(base)).length;
      const finalLabel = n ? (base + " " + (n + 1)) : label;
      pk.custom = [...pk.custom, { k, label: finalLabel.slice(0, 12) }];
    }
  }
  paintPick(scope);
  if(act === "add"){ const n = box.querySelector("[data-pkin]"); if(n) n.focus(); }
}
function bindPick(box){
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-pk]");
    if(!b) return;
    e.preventDefault();
    const pbox = b.closest("[data-scope]");
    pickAction(pbox.dataset.scope, b.dataset.pk, b.dataset.k, pbox);
  });
  box.addEventListener("keydown", e => {
    if(e.key !== "Enter" || e.isComposing || !e.target.matches("[data-pkin]")) return;
    e.preventDefault();
    const pbox = e.target.closest("[data-scope]");
    pickAction(pbox.dataset.scope, "add", null, pbox);
  });
}

let xlsxLib = null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLib) return xlsxLib;
  xlsxLib = new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = () => ok(window.XLSX);
    s.onerror = () => { xlsxLib = null; no(new Error("xlsx load failed")); };
    document.head.appendChild(s);
  });
  return xlsxLib;
}
const ymd = ms => { const d = new Date(ms || Date.now()); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const shortTag = id => id ? "#" + String(id).slice(-4) : "";

$("xlsxBtn").addEventListener("click", async () => {
  const songs = posts.filter(p => p.board === "setlist").sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  if(!songs.length) return toast("아직 제안된 곡이 없어요.");
  $("xlsxBtn").disabled = true;
  try{
    const XLSX = await loadXlsx();

    // 시트 1: 곡별 세션 — 기본 6개는 열로, 추가 세션은 한 칸에 모아서. 뺀 세션은 "—"
    const head1 = ["번호", "곡명", "아티스트", ...DEFAULT_SLOTS.map(s => s.label), "추가 세션", "빈 세션", "제안자", "제안일", "댓글 수"];
    const rows1 = songs.map((p, i) => {
      const sl = slotsOf(p), keys = sl.map(s => s.k);
      const cols = DEFAULT_SLOTS.map(s => keys.includes(s.k) ? applicants(p, s.k).map(a => a.name).join(", ") : "—");
      const extra = sl.filter(s => CUSTOM_KEYS.includes(s.k))
        .map(s => s.label + ": " + (applicants(p, s.k).map(a => a.name).join(", ") || "없음")).join(" / ");
      const emptyS = sl.filter(s => !applicants(p, s.k).length).map(s => s.label).join(", ");
      return [i + 1, p.title, p.artist || "", ...cols, extra, emptyS || "없음", p.author || "익명", ymd(p.createdAt), (p.comments || []).length];
    });
    const ws1 = XLSX.utils.aoa_to_sheet([head1, ...rows1]);
    ws1["!cols"] = [{wch:5},{wch:24},{wch:16}, ...DEFAULT_SLOTS.map(() => ({wch:16})), {wch:28},{wch:22},{wch:14},{wch:11},{wch:7}];
    ws1["!autofilter"] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:rows1.length, c:head1.length-1} }) };

    // 시트 2: 지원자별
    const rows2 = [];
    songs.forEach((p, i) => slotsOf(p).forEach(s =>
      applicants(p, s.k).forEach(a => rows2.push([a.name, shortTag(a.id), i + 1, p.title, p.artist || "", s.label]))));
    rows2.sort((a,b) => a[0].localeCompare(b[0], "ko") || a[2] - b[2]);

    ws2["!cols"] = [{wch:14},{wch:7},{wch:7},{wch:24},{wch:16},{wch:10}];

/* ---------- 렌더 공통 ---------- */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');

function when(ms){
  if(!ms) return "";
  const d = new Date(ms), n = new Date(), s = (n - d) / 1000;
  if(s < 60) return "방금";
  if(s < 3600) return Math.floor(s/60) + "분 전";
  if(s < 86400) return Math.floor(s/3600) + "시간 전";
  const y = d.getFullYear() === n.getFullYear() ? "" : d.getFullYear() + ".";
  return y + (d.getMonth()+1) + "." + d.getDate();
}
// 같은 이름을 다른 사람이 써도 구분되게, 기기마다 고유한 짧은 태그
const tag = id => id ? '<span class="tag" title="작성한 기기 표시">' + esc(shortTag(id)) + '</span>' : "";

function applicants(p, key){
  const m = ((p.sessions || {})[key]) || {};
  return Object.keys(m).filter(id => m[id])
    .map(id => ({ id, name: m[id].name || "익명", at: m[id].at || 0 }))
    .sort((a,b) => a.at - b.at);
}

  // 글 관리: 작성자는 수정만, 관리자는 수정·고정·삭제
  if(canEdit && !isEditing){
    h += '<div class="sec-h"><b>' + (isAdm ? "관리" : "내 글") + '</b></div><div class="group">';
    h += '<button class="row actrow" data-act="edit"><span>글 수정</span>' + ICON.chevR + '</button>';
    if(isAdm){
      if(p.board === "notice") h += '<button class="row actrow" data-act="pin"><span>' + (p.pinned ? "고정 해제" : "위에 고정") + '</span>' + ICON.pin + '</button>';
      h += '<button class="row actrow red" data-act="del"><span>글 삭제</span></button>';
    }
    h += '</div>';
  }

  view.innerHTML = h;
  if(focusF){
    const el = view.querySelector('[data-f="' + focusF + '"]');
    if(el){ el.focus(); try{ el.setSelectionRange(selS, selE); }catch(e){} }
  }
}

// 입력 중인 값 보관 (다른 사람이 글을 바꿔서 화면이 다시 그려져도 안 날아가게)
$("detailView").addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.f;
  if(!f) return;
  if(f === "cmt") cmtDraft = e.target.value; else draft[f] = e.target.value;
});
bindPick($("detailView"));

/* ---------- 동작 ---------- */
$("detailView").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  if(act === "back"){ go(board); return; }
  const p = posts.find(x => x.id === openId);
  if(!db || !p) return;
  if(!uid) return toast("아직 연결 중이에요. 잠시 후 다시 눌러 주세요.");
  const ref = doc(db, "posts", p.id);

  try{
    if(act === "apply"){
      if(!nick()){ askNick(true); if(!nick()) return; }
      const key = b.dataset.k;
      const mine = applicants(p, key).some(a => a.id === uid);
      b.disabled = true;
      await updateDoc(ref, { ["sessions." + key + "." + uid]: mine ? deleteField() : { name: nick(), at: Date.now() } });
      const s = slotsOf(p).find(s => s.k === key);
      toast(mine ? "지원을 취소했어요." : (s ? s.label : "") + "에 지원했어요.");
    }
    else if(act === "cmt"){
      await addComment(p, $("detailView").querySelector('[data-f="cmt"]'));
    }
    /* ---- 작성자 본인 또는 관리자: 글 수정 ---- */
    else if(act === "edit" || act === "editCancel" || act === "editSave"){
      const canEditPost = admin || (!!p.authorId && p.authorId === uid);
      if(!canEditPost) return;
      if(act === "edit"){
        editing = p.id; draft = { eTitle: p.title || "", eArtist: p.artist || "", eBody: p.body || "" };
        picks.edit = admin ? pickFromSlots(slotsOf(p)) : null;
        render(); window.scrollTo(0, 0);
        const t = $("detailView").querySelector('[data-f="eTitle"]'); if(t) t.focus();
      }
      else if(act === "editCancel"){ editing = null; draft = {}; render(); }
      else {
        const title = String(draft.eTitle || "").trim();
        if(!title) return toast("제목을 비워 둘 수는 없어요.");
        const upd = {
          title,
          artist: p.board === "setlist" ? String(draft.eArtist || "").trim() : (p.artist || ""),
          body: String(draft.eBody || "").trim(),
          editedAt: Date.now()
        };
        if(admin && p.board === "setlist" && picks.edit){
          const next = slotsFromPick(picks.edit), nextKeys = next.map(s => s.k);
          const removed = slotsOf(p).map(s => s.k).filter(k => !nextKeys.includes(k));
          const lost = removed.reduce((n, k) => n + applicants(p, k).length, 0);
          if(lost && !confirm("뺀 세션에 지원한 사람이 " + lost + "명 있어요. 그 지원 기록도 함께 지워집니다. 저장할까요?")) return;
          upd.slots = next;
          removed.forEach(k => { upd["sessions." + k] = deleteField(); });
        }
        b.disabled = true;
        await updateDoc(ref, upd);
        editing = null; draft = {}; render(); toast("수정했어요.");
      }
    }
    /* ---- 작성자 본인 또는 관리자: 댓글 수정 ---- */
    else if(act === "editc"){
      const i = Number(b.dataset.i), c = (p.comments || [])[i];
      if(!c) return;
      if(!(admin || (!!c.authorId && c.authorId === uid))) return;
      const v = prompt("댓글 수정", c.body);
      if(v === null || !v.trim() || v.trim() === c.body) return;
      const next = p.comments.slice();
      next[i] = { ...c, body: v.trim().slice(0, 500), editedAt: Date.now() };
      // cEdit: 몇 번째 댓글을 고쳤는지 보안 규칙에 알려 주는 값
      await updateDoc(ref, { comments: next, cEdit: i });
      toast("댓글을 수정했어요.");
    }
    /* ---- 여기부터 관리자 전용 ---- */
    else if(!admin){ return; }
    else if(act === "kick"){
      const name = (applicants(p, b.dataset.k).find(a => a.id === b.dataset.id) || {}).name || "";
      if(!confirm(name + " 님을 이 세션에서 뺄까요?")) return;
      await updateDoc(ref, { ["sessions." + b.dataset.k + "." + b.dataset.id]: deleteField() });
    }
    else if(act === "pin"){
      await updateDoc(ref, { pinned: !p.pinned });
      toast(p.pinned ? "고정을 해제했어요." : "위에 고정했어요.");
    }
    else if(act === "del"){
      if(!confirm("이 글을 삭제할까요?")) return;
      await deleteDoc(ref);
      go(board); toast("삭제했어요.");
    }
    else if(act === "delc"){
      if(!confirm("이 댓글을 삭제할까요?")) return;
      const target = (p.comments || [])[Number(b.dataset.i)];
      if(target) await updateDoc(ref, { comments: arrayRemove(target) });
    }
  }catch(err){ fail(err, "처리하지 못했어요."); render(); }
});

$("detailView").addEventListener("keydown", e => {
  if(e.key !== "Enter" || e.isComposing) return;
  const inp = e.target.closest('[data-f="cmt"]');
  if(!inp) return;
  e.preventDefault();
  const p = posts.find(x => x.id === openId);
  if(p) addComment(p, inp).catch(err => fail(err, "댓글을 남기지 못했어요."));
});

async function addComment(p, inp){
  if(!inp || !uid) return;
  const text = inp.value.trim();
  if(!text) return;
  if(!nick()){ askNick(true); if(!nick()) return; }
  inp.disabled = true;
  try{
    await updateDoc(doc(db, "posts", p.id), {
      comments: arrayUnion({ author: nick() || "익명", authorId: uid, body: text, createdAt: Date.now() })
    });
    cmtDraft = "";
    const cur = $("detailView").querySelector('[data-f="cmt"]');
    if(cur){ cur.value = ""; }
  } finally {
    const cur = $("detailView").querySelector('[data-f="cmt"]');
    if(cur){ cur.disabled = false; cur.focus(); }
  }
}

/* ---------- 상태 ---------- */
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast glass" + ($("app").classList.contains("hide") ? " top" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
function banner(html){ $("stateBar").innerHTML = '<div class="notice-bar">' + html + '</div>'; }
function setReadOnly(html){ readOnly = true; banner(html); render(); }
function fail(err, msg){
  console.error(err);
  if(err && err.code === "permission-denied"){
    toast("권한이 없어 처리하지 못했어요.");
    return;
  }
  toast(msg);
}

/* ---------- 시작 ---------- */
function boot(){
  if(!firebaseConfig.projectId || String(firebaseConfig.projectId).startsWith("여기에")){
    loaded = true;
    setReadOnly("아직 Firebase 설정이 들어 있지 않아요. <code>index.html</code> 위쪽의 <code>firebaseConfig</code>를 콘솔 값으로 바꿔 주세요.");
    return;
  }
  let app;
  try{
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
  }catch(err){
    loaded = true;
    setReadOnly("Firebase에 연결하지 못했어요. 설정값을 다시 확인해 주세요.");
    return;
  }

  // 글 목록 실시간 구독
  onSnapshot(
    query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(300)),
    snap => {
      loaded = true;
      posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    },
    err => {
      loaded = true;
      setReadOnly(err && err.code === "permission-denied"
        ? "Firestore 보안 규칙 때문에 글을 읽을 수 없어요. <code>firestore.rules</code> 내용을 콘솔에 붙여 넣어 주세요."
        : "게시판을 불러오지 못했어요. 새로고침해 주세요.");
    }
  );

  // 기기별 익명 로그인 → 관리자 여부 확인
  onAuthStateChanged(auth, async user => {
    if(!user){
      signInAnonymously(auth).catch(err => {
        console.error(err);
        setReadOnly("로그인 설정이 되어 있지 않아 지금은 읽기만 할 수 있어요. Firebase 콘솔 → Authentication → 로그인 방법에서 <b>익명</b>을 사용 설정해 주세요.");
      });
      return;
    }
    uid = user.uid;
    try{ admin = (await getDoc(doc(db, "admins", uid))).exists(); }catch(e){ admin = false; }
    paintAdmin(); paintNick(); render();
  });
}

// 저장된 이름이 있으면 첫 화면 없이 바로 게시판으로
if(nick()) show();
else { try{ $("nickIn").focus(); }catch(e){} }
</script>
